
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "async-pipeline-engine"
version = "0.1.0"
description = "A lightweight async event processing and data pipeline engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]